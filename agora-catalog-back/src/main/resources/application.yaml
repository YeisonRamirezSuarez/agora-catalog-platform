# Configuración común a todos los perfiles.
#
# Los perfiles solo sobrescriben lo que cambia por ambiente:
#   - local  -> application-local.yaml (desarrollo en la máquina de cada quien)
#   - dev    -> application-dev.yaml   (ambiente desplegado de pruebas)
#   - prod   -> application-prod.yaml  (producción: solo loopback y sin Swagger)
# Ninguno lleva secretos: se versionan tal cual.
#
# Los secretos NUNCA van escritos en este archivo: se leen de variables de entorno.
# El archivo `.env` del directorio de trabajo se carga solo (ver SecretsEnvironmentPostProcessor
# y .env.example en la raíz del backend). Lo que ya esté en el entorno del sistema gana.

server:
  port: ${SERVER_PORT:9092}
  compression:
    enabled: true
    mime-types: application/json
    min-response-size: 2KB
  servlet:
    context-path: /api

spring:
  application:
    name: agora-catalog-back
  servlet:
    multipart:
      # Una foto: 5 MB (el servicio de imágenes da el mensaje claro). El ZIP de fotos de la importación: 50 MB.
      max-file-size: 50MB
      max-request-size: 52MB
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  autoconfigure:
    # Sin esto Spring crea un usuario en memoria y escribe su contraseña en el log. El login
    # es propio (JWT contra la tabla de usuarios), así que ese usuario no debe existir.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  security:
    filter:
      # `async` queda fuera a propósito: la sesión es STATELESS, así que en el re-despacho
      # asíncrono de una respuesta en streaming no hay SecurityContext que restaurar y la
      # cadena respondería Access Denied con la respuesta ya comprometida. `error` queda
      # dentro para que /error siga cubierto.
      dispatcher-types: request, error
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

config:
  jwt:
    # Clave de firma HMAC, en base64. El algoritmo lo deriva jjwt del largo de la clave
    # decodificada (>=32 bytes HS256, >=64 HS512). Generar: openssl rand -base64 64
    secret: ${JWT_SECRET}
    # Corto a propósito: desactivar una empresa o un usuario corta su acceso en este tiempo.
    access-minutes: 15
    refresh-days: 7

settings:
  # URL pública del front. Arma los enlaces de los correos (ingresar al panel) y los de la vista
  # previa del catálogo en WhatsApp (og:url, og:image).
  frontend-url: ${FRONTEND_URL:http://localhost:4251}

  # index.html del front compilado. /c/{slug}-{hash} lo devuelve con las etiquetas Open Graph del
  # negocio (vista previa al compartir el link por WhatsApp). Vacío en desarrollo: ahí /c/ lo
  # atiende `ng serve` y no hay vista previa.
  front-index-path: ${FRONT_INDEX_PATH:}

  encryption:
    aes:
      # Cifra en la base la contraseña del proveedor de correo. Cualquier largo (se deriva con
      # SHA-256). Si se cambia, lo ya cifrado deja de leerse. Generar: openssl rand -hex 32
      key: ${AES_KEY}

  # Carpeta donde se guardan las fotos (logo, portada, productos). Se sirven en /api/uploads/**.
  # Respaldarla junto con la base: sin ella las fotos se pierden.
  storage-path: ${STORAGE_PATH:./uploads}

  # Usuario SUPER_ADMIN que se crea al arrancar si su correo no existe (SuperAdminBootstrap).
  # Sin correo o sin contraseña no se crea nada. Se le pide cambiar la contraseña al entrar.
  superadmin:
    nombre: ${SUPERADMIN_NAME:}
    email: ${SUPERADMIN_EMAIL:}
    password: ${SUPERADMIN_PASSWORD:}

  # Zona horaria del proyecto (nombre IANA). TimeZoneEnvironmentPostProcessor la pone como zona de
  # la JVM al arrancar: fechas del backend (oferta vigente, producto nuevo) y sesión de cada
  # conexión a PostgreSQL.
  time-zone: ${APP_TIME_ZONE:America/Bogota}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4251}

  security:
    # Cuántos proxies AGREGAN a X-Forwarded-For entre el cliente y esta aplicación.
    # 0 si el navegador habla directo con el backend; 1 detrás de Caddy.
    # Un valor mayor al real permite falsificar la IP del cliente (y saltar el rate limit).
    trusted-proxy-count: ${TRUSTED_PROXY_COUNT:0}
    # Límite de peticiones por IP a /auth y /public (RateLimitFilter). Solo las pruebas lo apagan.
    rate-limit-enabled: true

  # De dónde salen los secretos. 'env' lee el archivo .env del directorio de trabajo.
  secrets:
    provider: env

  flyway:
    # true aplica las migraciones pendientes al arrancar.
    enabled: ${FLYWAY_ENABLED:true}
    # SOLO en local: aplica una migración con versión menor a la última registrada. En un
    # ambiente compartido esconde el problema y el esquema deja de ser reproducible.
    out-of-order: false
    # Aplica además db/seed (empresa, productos y usuarios de prueba). Solo local y docker-compose.
    seed: ${FLYWAY_SEED:false}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
