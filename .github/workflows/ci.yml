# ============================================================================
# Integración continua
# ============================================================================
# En cada push y pull request comprueba que:
#   - el backend compila, Flyway construye la base DESDE CERO y pasan sus pruebas;
#   - el frontend instala en limpio, compila en modo producción y pasa sus pruebas.
# NO despliega nada y NO toca ninguna base compartida: las migraciones corren contra un
# PostgreSQL efímero que nace y muere con la corrida.
# ============================================================================
name: CI

on:
  push:
    branches: [master, develop]
  pull_request:

jobs:
  backend:
    name: Backend — compila, migra desde cero y prueba
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: agora_catalog
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agora_catalog"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: agora-catalog-back
    env:
      DB_URL: jdbc:postgresql://localhost:5432/agora_catalog?currentSchema=main
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      # Secreto descartable: solo existe durante la corrida.
      JWT_SECRET: Y2ktZGVzY2FydGFibGUtc29sby1wYXJhLWxhcy1wcnVlYmFzLWRlLWludGVncmFjaW9uLTEyMzQ1Njc4OTA=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      # `build` corre las pruebas; contextLoads arranca la app y Flyway aplica todas las migraciones.
      - run: ./gradlew build --no-daemon

  frontend:
    name: Frontend — instala en limpio, compila y prueba
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agora-catalog-front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: agora-catalog-front/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx ng test --watch=false
