# ============================================================================
# Integración continua
# ============================================================================
# En cada push y pull request comprueba que:
#   - el backend compila, Flyway construye la base DESDE CERO y pasan sus pruebas;
#   - el frontend instala en limpio, compila en modo producción y pasa sus pruebas;
#   - las pantallas (catálogo y panel) funcionan en un Chrome de verdad (Playwright, e2e/).
# NO despliega nada y NO toca ninguna base compartida: las migraciones corren contra un
# PostgreSQL efímero que nace y muere con la corrida.
# ============================================================================
name: CI

on:
  push:
    branches: [master, develop]
  pull_request:

jobs:
  backend:
    name: Backend — compila, migra desde cero y prueba
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: agora_catalog
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agora_catalog"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: agora-catalog-back
    env:
      DB_URL: jdbc:postgresql://localhost:5432/agora_catalog?currentSchema=main
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      # Secreto descartable: solo existe durante la corrida.
      JWT_SECRET: Y2ktZGVzY2FydGFibGUtc29sby1wYXJhLWxhcy1wcnVlYmFzLWRlLWludGVncmFjaW9uLTEyMzQ1Njc4OTA=
      AES_KEY: ci-descartable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      # `build` corre las pruebas; contextLoads arranca la app y Flyway aplica todas las migraciones.
      - run: ./gradlew build --no-daemon

  frontend:
    name: Frontend — instala en limpio, compila y prueba
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agora-catalog-front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: agora-catalog-front/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx ng test --watch=false

  pantallas:
    name: Pantallas — catálogo y panel en Chrome (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: agora_catalog
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agora_catalog"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # API en perfil local: carga la semilla (negocio y administrador de prueba).
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://localhost:5432/agora_catalog?currentSchema=main
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: Y2ktZGVzY2FydGFibGUtc29sby1wYXJhLWxhcy1wcnVlYmFzLWRlLWludGVncmFjaW9uLTEyMzQ1Njc4OTA=
      AES_KEY: ci-descartable
      FRONTEND_URL: http://127.0.0.1:4300
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:4300
      TRUSTED_PROXY_COUNT: 1
      # Todas las pruebas salen de la misma IP: sin límite de peticiones.
      SETTINGS_SECURITY_RATE_LIMIT_ENABLED: 'false'
      FRONT_INDEX_PATH: ${{ github.workspace }}/agora-catalog-front/dist/agora-catalog-front/browser/index.html
      STORAGE_PATH: ${{ runner.temp }}/uploads
      # Super admin descartable para la prueba del super admin (le cambia la contraseña).
      SUPERADMIN_NAME: Super E2E
      SUPERADMIN_EMAIL: super-e2e@prueba.local
      SUPERADMIN_PASSWORD: Descartable-e2e-1
      E2E_SUPER_EMAIL: super-e2e@prueba.local
      E2E_SUPER_PASSWORD: Descartable-e2e-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: agora-catalog-front/package-lock.json
      - name: Compilar la API
        working-directory: agora-catalog-back
        run: ./gradlew bootJar --no-daemon
      - name: Compilar el front
        working-directory: agora-catalog-front
        run: npm ci && npm run build
      - name: Levantar la API y la app (puerto 4300)
        run: |
          JAR=$(ls agora-catalog-back/build/libs/*.jar | grep -v plain)
          nohup java -jar "$JAR" > api.log 2>&1 &
          nohup python3 herramientas/servidor/serve_app.py agora-catalog-front/dist/agora-catalog-front/browser 4300 --api http://127.0.0.1:9092 > web.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:4300/api/public/catalogos/x7k2m9ab && exit 0; sleep 2; done
          echo "La API no respondió"; tail -50 api.log; exit 1
      - name: Instalar Chromium
        working-directory: agora-catalog-front
        run: npx playwright install --with-deps chromium
      - name: Pruebas de pantalla
        working-directory: agora-catalog-front
        run: npx playwright test
      - name: Guardar el reporte si algo falló
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pantallas
          path: |
            agora-catalog-front/playwright-report/
            agora-catalog-front/test-results/
            api.log
            web.log
          retention-days: 7
